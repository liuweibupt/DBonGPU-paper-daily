name: Daily Paper Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-update.yml'
      - 'main.py'
      - 'src/**'
      - 'data_sources/**'
  schedule:
    # 主触发：UTC 1:00 = 北京时间 9:00
    - cron: '0 1 * * *'
    # 备用触发：UTC 1:30，防止主触发被 GitHub 跳过
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      update_top100:
        description: 'Also refresh both annual Top 100 lists'
        type: boolean
        default: true
  repository_dispatch:
    types: [trigger-daily]

permissions:
  contents: write

concurrency:
  group: daily-paper-update
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  fetch-daily:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache the local translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/paper-daily
          key: ${{ runner.os }}-paper-daily-translation-${{ hashFiles('src/analysis/translator.py') }}

      - name: Check for Codex authentication
        id: codex-auth
        if: vars.PAPER_DAILY_CODEX != '0'
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
        run: |
          if [[ -n "$CODEX_API_KEY" ]]; then
            echo 'source=codex' >> "$GITHUB_OUTPUT"
          elif [[ -n "$OPENAI_API_KEY" ]]; then
            case "$OPENAI_API_BASE" in
              ''|https://api.openai.com|https://api.openai.com/|https://api.openai.com/v1|https://api.openai.com/v1/)
                echo 'source=openai' >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Install Codex CLI
        if: steps.codex-auth.outputs.source != ''
        continue-on-error: true
        timeout-minutes: 3
        run: |
          codex_prefix="$RUNNER_TEMP/paper-daily-codex"
          npm install --global --prefix "$codex_prefix" @openai/codex@0.170.0
          "$codex_prefix/bin/codex" --version
          echo "$codex_prefix/bin" >> "$GITHUB_PATH"

      - name: Fetch daily GPU DB and architecture papers
        env:
          CODEX_API_KEY: ${{ steps.codex-auth.outputs.source == 'openai' && secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
          PAPER_DAILY_CODEX: ${{ vars.PAPER_DAILY_CODEX }}
          PAPER_DAILY_CODEX_MODEL: ${{ vars.PAPER_DAILY_CODEX_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          python main.py --html --feed all

      - name: Fetch yearly Top 100 papers
        if: github.event_name == 'workflow_dispatch' && inputs.update_top100
        env:
          CODEX_API_KEY: ${{ steps.codex-auth.outputs.source == 'openai' && secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
          PAPER_DAILY_CODEX: ${{ vars.PAPER_DAILY_CODEX }}
          PAPER_DAILY_CODEX_MODEL: ${{ vars.PAPER_DAILY_CODEX_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          python main.py --top100 --feed all

      - name: Render the classic paper collections
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python main.py --classics --feed all

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "docs: 更新论文日报 $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
